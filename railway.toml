# The Dockerfile pins Node and Caddy explicitly. Nixpacks was auto-detecting an
# EOL Node version (removed from nixpkgs) and mixing bun/npm, which broke builds.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
numReplicas = 1
